<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Loading · Parker Vu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@600;700&family=Inter:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container inner">
      <a class="logo" href="home.html"><span class="mark">p</span> parker.dev</a>
      <nav class="nav-links">
        <a href="projects.html">Work</a>
        <a href="about.html">About</a>
        <a href="notes.html">Notes</a>
        <a href="contact.html">Contact</a>
      </nav>
      <div class="header-actions">
        <div class="search-chip">Search… <kbd class="k">⌘K</kbd></div>
        <div class="locale"><span class="on">EN</span><span>VI</span></div>
        <button class="icon-btn" aria-label="Theme"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5z"/></svg></button>
      </div>
    </div>
  </header>

  <main>
    <section class="hero atmosphere">
      <div class="grid-bg"></div>
      <div class="orb orb-a"></div>
      <div class="orb orb-b"></div>
      <div class="container hero-grid">
        <div>
          <div class="sk" style="width:280px;height:28px;border-radius:9999px;margin-bottom:20px"></div>
          <div class="sk" style="width:90%;height:56px;margin-bottom:12px"></div>
          <div class="sk" style="width:70%;height:56px;margin-bottom:20px"></div>
          <div class="sk" style="width:80%;height:20px;margin-bottom:8px"></div>
          <div class="sk" style="width:60%;height:20px;margin-bottom:28px"></div>
          <div style="display:flex;gap:12px">
            <div class="sk" style="width:160px;height:40px"></div>
            <div class="sk" style="width:140px;height:40px"></div>
          </div>
        </div>
        <div class="sk" style="height:260px;border-radius:12px"></div>
      </div>
    </section>

    <div class="band">
      <section class="section" style="padding-bottom:40px">
        <div class="container">
          <div class="stats">
            <div><div class="sk" style="width:40px;height:40px;border-radius:10px;margin-bottom:12px"></div><div class="sk" style="width:72px;height:40px;margin-bottom:8px"></div><div class="sk" style="width:96px;height:12px"></div></div>
            <div><div class="sk" style="width:40px;height:40px;border-radius:10px;margin-bottom:12px"></div><div class="sk" style="width:56px;height:40px;margin-bottom:8px"></div><div class="sk" style="width:110px;height:12px"></div></div>
            <div><div class="sk" style="width:40px;height:40px;border-radius:10px;margin-bottom:12px"></div><div class="sk" style="width:48px;height:40px;margin-bottom:8px"></div><div class="sk" style="width:140px;height:12px"></div></div>
            <div><div class="sk" style="width:40px;height:40px;border-radius:10px;margin-bottom:12px"></div><div class="sk" style="width:40px;height:40px;margin-bottom:8px"></div><div class="sk" style="width:128px;height:12px"></div></div>
          </div>
          <div style="display:flex;gap:8px;margin-top:32px;padding-top:24px;border-top:1px solid var(--border);overflow:hidden">
            <div class="sk" style="width:72px;height:28px;border-radius:9999px;flex:none"></div>
            <div class="sk" style="width:88px;height:28px;border-radius:9999px;flex:none"></div>
            <div class="sk" style="width:110px;height:28px;border-radius:9999px;flex:none"></div>
            <div class="sk" style="width:64px;height:28px;border-radius:9999px;flex:none"></div>
            <div class="sk" style="width:96px;height:28px;border-radius:9999px;flex:none"></div>
            <div class="sk" style="width:80px;height:28px;border-radius:9999px;flex:none"></div>
            <div class="sk" style="width:72px;height:28px;border-radius:9999px;flex:none"></div>
            <div class="sk" style="width:90px;height:28px;border-radius:9999px;flex:none"></div>
          </div>
        </div>
      </section>
    </div>

    <section class="section">
      <div class="container">
        <div class="sk" style="width:220px;height:28px;margin-bottom:24px"></div>
        <div class="featured-card">
          <div class="sk" style="aspect-ratio:16/10;border-radius:12px"></div>
          <div>
            <div class="sk" style="width:140px;height:24px;border-radius:9999px;margin-bottom:16px"></div>
            <div class="sk" style="width:70%;height:32px;margin-bottom:12px"></div>
            <div class="sk" style="width:100%;height:16px;margin-bottom:8px"></div>
            <div class="sk" style="width:80%;height:16px;margin-bottom:20px"></div>
            <div class="sk" style="width:180px;height:16px"></div>
          </div>
        </div>
      </div>
    </section>

    <div class="band">
      <section class="section">
        <div class="container">
          <div class="sk" style="width:180px;height:28px;margin-bottom:24px"></div>
          <div class="domain-grid">
            <div class="sk" style="height:140px;border-radius:8px"></div>
            <div class="sk" style="height:140px;border-radius:8px"></div>
            <div class="sk" style="height:140px;border-radius:8px"></div>
            <div class="sk" style="height:140px;border-radius:8px"></div>
          </div>
        </div>
      </section>
    </div>

    <section class="section">
      <div class="container">
        <div class="sk" style="width:200px;height:28px;margin-bottom:24px"></div>
        <div style="display:flex;flex-direction:column;gap:0;max-width:360px">
          <div class="sk" style="height:48px;border-radius:8px"></div>
          <div style="width:2px;height:16px;background:var(--border);margin-left:20px"></div>
          <div class="sk" style="height:48px;border-radius:8px"></div>
          <div style="width:2px;height:16px;background:var(--border);margin-left:20px"></div>
          <div class="sk" style="height:56px;border-radius:8px"></div>
          <div style="width:2px;height:16px;background:var(--border);margin-left:20px"></div>
          <div class="sk" style="height:48px;border-radius:8px"></div>
          <div style="width:2px;height:16px;background:var(--border);margin-left:20px"></div>
          <div class="sk" style="height:48px;border-radius:8px"></div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
