name: Validate content

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Localized JSON
        run: node scripts/validate.mjs .
      - name: Check content structure
        run: node scripts/check-content.mjs .
      - name: Check study plan
        run: node scripts/check-plan.mjs . --strict
      - name: Check practice module (steps + design gallery)
        run: node scripts/check-practice.mjs . --strict
      - name: Check practice index
        run: node scripts/sync-practice-index.mjs --check
